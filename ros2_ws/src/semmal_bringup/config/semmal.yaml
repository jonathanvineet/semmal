# Node parameters for the SEMMAL robot stack (simulation profile).
# Thresholds below are SIMULATION values. Never copy them to hardware without validation.
safety_supervisor:
  ros__parameters:
    max_linear: 0.5
    max_angular: 1.5
    max_linear_accel: 0.8
    max_angular_accel: 3.0
    stopping_decel: 1.5
    degraded_scale: 0.5
    stop_distance: 0.15        # m beyond the footprint (range - footprint_offset)
    slow_distance: 0.6
    footprint_offset: 0.25     # lidar to front/rear bumper
    sector_half_angle: 0.6
    cmd_timeout: 0.5
    scan_timeout: 1.0
    odom_timeout: 0.5
    encoder_timeout: 0.5
    motor_diag_timeout: 0.5
    startup_grace: 60.0
    geofence: [-9.7, -6.7, 9.7, 6.7]
    rate_hz: 20.0

diagnostics_node:
  ros__parameters:
    overcurrent_a: 6.0
    overtemp_c: 90.0
    debounce_s: 0.2
    clear_hold_s: 2.0
    encoder_stale_s: 0.5
    motion_eps: 0.5
    mismatch_tol: 3.0
    mismatch_s: 1.5
    watchdog_s: 0.5
    battery_low_pct: 15.0
    battery_critical_pct: 5.0

motor_sim_node:
  ros__parameters:
    wheel_separation: 0.36
    wheel_radius: 0.06

battery_node:
  ros__parameters:
    initial_percentage: 92.0

mission_executor:
  ros__parameters:
    max_speed: 0.4
    max_angular: 1.2
    stuck_timeout_s: 20.0
