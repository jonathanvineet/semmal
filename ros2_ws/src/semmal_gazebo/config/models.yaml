# Fuel models used by the house world. URIs are version-pinned for reproducibility.
# All OpenRobotics models below are CC BY 4.0 (http://creativecommons.org/licenses/by/4.0/).
# Fetch into the local Fuel cache with scripts/robot/fetch_models.sh; Gazebo then runs offline.
# front_deg: direction (model frame, degrees) the model's usable front faces, read from top-down
#            renders and verified by placing every model `facing: south` in front of a camera. Layouts say `facing: south` and the generator derives the yaw.
# Dropped after inspection: Washer (collision mesh measures 3 cm), Shower (wall-mounted head only).
models:
  sofa: {uri: 'https://fuel.gazebosim.org/1.0/OpenRobotics/models/Sofa/3', front_deg: 0, author: OpenRobotics, license: CC-BY-4.0}
  minisofa: {uri: 'https://fuel.gazebosim.org/1.0/OpenRobotics/models/MiniSofa/3', front_deg: 180, author: OpenRobotics, license: CC-BY-4.0}
  coffeetable: {uri: 'https://fuel.gazebosim.org/1.0/OpenRobotics/models/CoffeeTable/2', front_deg: 0, author: OpenRobotics, license: CC-BY-4.0}
  tvstand: {uri: 'https://fuel.gazebosim.org/1.0/OpenRobotics/models/TVStand/2', front_deg: -90, author: OpenRobotics, license: CC-BY-4.0}
  bookshelf: {uri: 'https://fuel.gazebosim.org/1.0/OpenRobotics/models/Bookshelf/4', front_deg: -90, author: OpenRobotics, license: CC-BY-4.0}
