# SEMMAL warehouse layout — single source of truth.
# generate_world.py renders this into worlds/warehouse.sdf and
# semmal_navigation/maps/warehouse.{pgm,yaml}. Edit here, then regenerate.
# Units: metres, radians. World frame: origin at warehouse centre, +x east, +y north.

name: warehouse
floor: { size_x: 20.0, size_y: 14.0 }
walls: { thickness: 0.2, height: 2.5 }

# Solid boxes: [name, centre_x, centre_y, size_x, size_y, size_z, colour rgba]
obstacles:
  # Three shelf rows (aisles at y = -1.5 and y = +1.5).
  - { name: shelf_row_south,  x: -1.0, y: -3.0, sx: 8.0, sy: 0.8, sz: 2.0, rgba: [0.20, 0.33, 0.55, 1] }
  - { name: shelf_row_middle, x: -1.0, y:  0.0, sx: 8.0, sy: 0.8, sz: 2.0, rgba: [0.20, 0.33, 0.55, 1] }
  - { name: shelf_row_north,  x: -1.0, y:  3.0, sx: 8.0, sy: 0.8, sz: 2.0, rgba: [0.20, 0.33, 0.55, 1] }
  # Static obstacles.
  - { name: pallet_stack_east, x:  7.5, y: -2.5, sx: 1.2, sy: 1.0, sz: 1.0, rgba: [0.62, 0.45, 0.25, 1] }
  - { name: pallet_stack_west, x: -8.8, y:  3.5, sx: 1.2, sy: 1.0, sz: 1.0, rgba: [0.62, 0.45, 0.25, 1] }
  - { name: pillar_north,      x:  0.0, y:  6.3, sx: 0.4, sy: 0.4, sz: 2.5, rgba: [0.55, 0.55, 0.55, 1] }
  # Inspection target: machine cabinet against the east wall.
  - { name: machine_cabinet,   x:  9.55, y: 1.5, sx: 0.5, sy: 1.2, sz: 1.8, rgba: [0.30, 0.30, 0.32, 1] }

# Visual-only markers (no collision, not in the occupancy map).
markers:
  # Machine panel face, visible to the camera from inspection_point_A.
  - { name: machine_panel,     x:  9.29, y: 1.5, z: 0.75, sx: 0.02, sy: 0.9, sz: 0.7, rgba: [0.95, 0.55, 0.10, 1] }
  - { name: dock_zone,         x: -8.0, y: -5.5, z: 0.001, sx: 1.2, sy: 1.2, sz: 0.002, rgba: [0.10, 0.60, 0.25, 1] }
  - { name: destination_zone,  x:  8.0, y: -5.2, z: 0.001, sx: 1.4, sy: 1.4, sz: 0.002, rgba: [0.85, 0.20, 0.20, 1] }
  - { name: inspection_marker, x:  8.0, y:  1.5, z: 0.001, sx: 0.6, sy: 0.6, sz: 0.002, rgba: [0.95, 0.75, 0.10, 1] }

robot_spawn: { x: -8.0, y: -5.5, yaw: 0.0 }

map:
  resolution: 0.05     # m/cell
  margin: 0.5          # map extends this far beyond the outer walls
